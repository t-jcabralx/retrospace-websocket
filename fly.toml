# A starting point for Fly.io:  fly launch --copy-config --config realtime-server/fly.toml --dockerfile realtime-server/Dockerfile
# then set the secrets (see README.md) and  fly deploy --config realtime-server/fly.toml --dockerfile realtime-server/Dockerfile
app = "retrospace-realtime"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # connections are kept open: the machine must stay up
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 3000
    hard_limit = 5000

[[http_service.checks]]
  method = "GET"
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
